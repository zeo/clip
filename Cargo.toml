[package]
name = "clip"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
publish = false
description = "Local game clipper"
license = "MIT OR Apache-2.0"
authors = ["zeo <96458554+zeo@users.noreply.github.com>"]

[dependencies]
windows = { version = "0.62.2", features = [
    "Data_Xml_Dom",
    "Foundation",
    "Foundation_Collections",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "UI_Notifications",
    "Win32_Devices",
    "Win32_Devices_Display",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
hdrkit = { git = "https://github.com/zeo/hdrkit", rev = "caac5aa0a83ac4e0e6f58729189d29022ad26564" }
# the implement macro expands to windows_core paths
windows-core = "0.62.2"
tauri = { version = "2.12", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-single-instance = "2.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
